# The live widgets on real Android (emulators): the proof Robolectric cannot
# give — foreground-service start rules, a killed process, a real reboot.
# e2e/live_e2e.sh has the steps; e2e/fake_haus.py stands in for Haus.
name: live-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday morning
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/cloud/dopp/haus/realtime/**'
      - 'app/src/main/java/cloud/dopp/haus/widget/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/androidTest/**'
      - 'e2e/**'
      - '.github/workflows/live-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # A throwaway CA, made here and gone with the runner; the debug-only trust in it.
      - name: Throwaway CA
        run: bash e2e/make_ca.sh e2e/out

      - name: Build the app and its e2e setup
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Start the fake Haus
        run: |
          nohup python3 e2e/fake_haus.py --port 8443 --cert e2e/out/server.pem --key e2e/out/server.key --log haus.log > fake_haus.out 2>&1 &
          for i in $(seq 1 20); do curl -sk https://127.0.0.1:8443/ctl/streams && break; sleep 0.5; done

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64

      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot for the cache"

      - name: Live e2e
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HAUS_LOG: haus.log
          E2E_OUT: e2e-out
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash e2e/live_e2e.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-api-${{ matrix.api-level }}
          path: |
            haus.log
            fake_haus.out
            e2e-out/
          if-no-files-found: warn
