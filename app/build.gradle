plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdkVersion 36
    namespace "cloud.dopp.haus"
    defaultConfig {
        // A new app (laib ADR 0022 §1): its own id, nothing carried from the old one.
        applicationId "cloud.dopp.haus"
        // Phase 3 raised 21 → 23: EncryptedSharedPreferences (Jetpack Security)
        // needs the AndroidKeyStore-backed master key from API 23.
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
        // The live e2e on emulators (e2e/, .github/workflows/live-e2e.yml).
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // Populated from env (CI secrets / local signed builds). When unset,
            // assembleRelease produces an unsigned APK — no hardcoded keystore.
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "haus"
                keyPassword(System.getenv("ANDROID_KEY_PASSWORD")
                        ?: System.getenv("ANDROID_KEYSTORE_PASSWORD"))
            }
        }
    }
    buildTypes {
        release {
            // Disabled during native development so R8 doesn't strip
            // reflection-referenced classes. Re-enable with keep rules before Play.
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lintOptions {
        checkReleaseBuilds false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

repositories {
    
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // --- Widgets and pairing ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Custom Tabs for pairing (/pair-device): it shares the browser's Authelia session.
    implementation 'androidx.browser:browser:1.8.0'
    // Encrypted-at-rest storage for the haus_device_… bearer token.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Read JPEG EXIF orientation so camera captures are rotated upright (#67).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Networking for the widget data/action calls.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Server-Sent Events client for the live stream, held while the screen is on (#176).
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    // Self-contained QR scanner for onboarding (no Google Play Services).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // JVM tests (Robolectric — runs Android components on the JVM, no emulator/VM).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'

    // The live e2e's setup on the emulator: pair and place widgets (e2e/live_e2e.sh).
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
